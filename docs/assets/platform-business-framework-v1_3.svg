<rect x="469" y="502" width="193" height="84" rx="12" fill="#f0f4fc" stroke="#4275ef" stroke-width="2"/>
<text x="496.5" y="549" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#242830">个体标签导入</text>
