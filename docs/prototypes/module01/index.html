function listView(){let data=filtered(),size=5,pages=Math.max(1,Math.ceil(data.length/size));state.pageNo=Math.min(state.pageNo,pages);let visible=data.slice((state.pageNo-1)*size,state.pageNo*size),f=state.filters;let batchOptions=[...new Set(state.records.map(x=>x.batch))].sort().reverse();
 return `<section class="panel"><form id="filters"><div class="filters"><label class="field">一级区域<select name="level1">${options(['山西'],f.level1,'全部一级区域')}</select></label><label class="field">二级区域<select name="level2">${options(['和顺','左权'],f.level2,'全部二级区域')}</select></label><label class="field">回收批次<select name="batch">${options(batchOptions,f.batch,'全部批次')}</select></label><label class="field">位点 / 相机编号<input name="keyword" placeholder="例如 701 或 701A" value="${escapeHTML(f.keyword)}"></label><label class="field">回收状态<select name="status">${options(['已回收','未回收'],f.status,'全部状态')}</select></label></div><div class="filter-bottom"><span class="small muted">未回收仍保留周期；空卡或文件损坏写在备注中</span><div class="actions"><button type="button" data-action="clearFilters">重置</button><button type="submit" class="primary">查询</button></div></div></form></section>
 <section class="panel"><div class="summary-row"><span>回收记录 <strong>${data.length}</strong> 条</span><span class="small muted">每个位点 / 相机 / 批次仅一条</span></div><div class="table-wrap"><table><thead><tr><th>区域 / 位点</th><th>相机编号</th><th>回收批次</th><th>工作日期</th><th>取回日期</th><th>回收状态</th><th>备注 / 异常</th><th>操作</th></tr></thead><tbody>${visible.length?visible.map(r=>`<tr><td><strong>${escapeHTML(r.site)}</strong><span class="sub">${escapeHTML(r.level1)} / ${escapeHTML(r.level2)}</span></td><td>${escapeHTML(r.device)}</td><td class="mono">${r.batch}</td><td class="mono">${r.start||'未知'}<span class="sub">至 ${r.end||'未知'}</span></td><td class="mono">${r.retrieved||'未填写'}</td><td>${tag(r.status)}</td><td class="reason">${escapeHTML(r.notes||r.issue)}</td><td><button class="link" data-detail="${escapeHTML(key(r))}">详情</button></td></tr>`).join(''):'<tr><td colspan="8"><div class="empty">没有符合条件的记录<br><span class="small">请调整筛选条件，或通过 Excel 导入建立记录。</span></div></td></tr>'}</tbody></table></div><div class="pagination"><span>${data.length?'第 '+((state.pageNo-1)*size+1)+'–'+Math.min(state.pageNo*size,data.length)+' 条，共 '+data.length+' 条':'共 0 条'}</span><div class="actions"><button data-action="prevPage" ${state.pageNo===1?'disabled':''}>上一页</button><span>${state.pageNo} / ${pages}</span><button data-action="nextPage" ${state.pageNo===pages?'disabled':''}>下一页</button></div></div></section><div class="notice"><strong>从批次出发，按相机保存</strong>对拍相机分别记录；回收文件数量不等同于独立探测事件，也不代表影像已导入。</div>`;
}
function wizardView(){return `<div class="steps" aria-label="导入进度">${['上传文件','预校验','确认导入','导入结果'].map((s,i)=>`<div class="step ${state.step===i+1?'current':state.step>i+1?'done':''}" ${state.step===i+1?'aria-current="step"':''}><span class="number">${state.step>i+1?'✓':i+1}</span><span>${s}</span></div>`).join('')}</div>${state.step===1?uploadView():state.step===2?validationView():state.step===3?confirmView():resultView()}`}
function uploadView(){return `<div class="two-cols"><section class="panel"><div class="panel-body"><h2 class="panel-title">上传工作与回收周期文件</h2><div class="drop"><div class="file-icon">XLSX</div><h3>选择整理好的 Excel 文件</h3><p>使用周期导入模板；每台相机一行</p><button data-action="chooseFile">选择本地文件</button><input type="file" id="fileInput" accept=".xlsx" hidden><div class="demo-choices"><button data-action="sampleError">载入含错误示例</button><button data-action="sampleFixed">载入已修正示例</button></div><div class="sample-help">低保真演示仅展示文件选择，校验使用内置示例；不解析真实 Excel。</div></div>${state.selected?`<div class="file-selected"><span class="tag">XLSX</span><div class="name-wrap"><div class="name">${escapeHTML(state.fileName)}</div><span class="small muted">${state.fixed?'内置示例：'+counts().new+' 条待新增、'+counts().duplicate+' 条重复':'示例数据已载入，尚未提交'}</span></div><button class="link" data-action="removeFile">移除</button></div>`:''}</div><div class="bottom-actions"><span class="small muted">区域与批次以文件内容为准</span><button class="primary" data-action="validate" ${!state.selected?'disabled':''}>开始预校验 →</button></div></section><section class="panel"><div class="panel-body"><h2 class="panel-title">准备文件</h2><button data-action="template">↓ 下载周期模板（示例）</button><hr style="border:0;border-top:1px solid #eee;margin:20px 0"><ol class="explain-list"><li>先建立位点，再导入工作与回收周期；不会自动建立未知区域或位点。</li><li>编号和批次按文本保留前导零；工作起止、取回日期只精确到日。</li><li>对拍 701A / 701B 分行填写，分别核实工作日期和回收状态。</li><li>空卡或文件损坏仍填“已回收”，异常写备注。</li><li>模板不包含期末维护日期；保留维护人员。</li></ol></div></section></div>`}
function metrics(){const c=counts();return `<div class="metric-grid"><div class="metric"><span>总行数</span><strong>${c.all}</strong></div><div class="metric"><span>待新增</span><strong>${c.new}</strong></div><div class="metric"><span>重复跳过</span><strong>${c.duplicate}</strong></div><div class="metric ${c.error?'emphasis':''}"><span>错误 / 冲突</span><strong>${c.error}</strong></div></div>`}
function validationView(){const c=counts();let visible=rows().filter(r=>state.tab==='all'||state.tab==='problem'&&['error','conflict'].includes(r.kind)||state.tab===r.kind);
 return `${metrics()}<div class="notice ${c.error?'error':''}" role="status"><strong>${c.error?'!　发现 '+c.error+' 条问题，整批尚未写入':'✓　预校验通过，尚未写入'}</strong>${c.error?'下载错误说明，在 Excel 修正后重新上传。相同记录跳过；冲突记录不覆盖。':c.new?'请核对涉及的区域、批次和数量，再确认导入。':'全部记录与已有内容相同，无需新增；可直接查看处理结果。'}</div><section class="panel"><div class="summary-row"><span>${escapeHTML(state.fileName)}</span><div class="actions">${c.error?'<button data-action="errorReport">↓ 下载错误说明</button>':''}<button data-action="reupload">重新上传</button>${c.error?'<button data-action="fixedHere">演示：重传已修正文件</button>':''}</div></div><div class="tabs" role="group" aria-label="按校验结果筛选">${[['all','全部',c.all],['new','待新增',c.new],['duplicate','重复',c.duplicate],['problem','错误 / 冲突',c.error]].map(([key_,name,count])=>`<button class="${state.tab===key_?'active':''}" data-tab="${key_}">${name} ${count}</button>`).join('')}</div><div class="table-wrap"><table><thead><tr><th>Excel 行号</th><th>区域 / 位点</th><th>相机</th><th>批次</th><th>工作日期</th><th>回收状态</th><th>处理结果</th><th>说明</th></tr></thead><tbody>${visible.length?visible.map(r=>`<tr><td>${r.line}</td><td><strong>${r.site}</strong><span class="sub">${r.level1} / ${r.level2}</span></td><td>${r.device}</td><td>${r.batch}</td><td>${r.start}<span class="sub">至 ${r.end}</span></td><td>${tag(r.status)}</td><td>${tag({new:'待新增',duplicate:'重复跳过',error:'错误',conflict:'冲突'}[r.kind],['error','conflict'].includes(r.kind)?'error':'new')}</td><td class="reason">${escapeHTML(r.reason||(r.kind==='duplicate'?'与已有记录一致，跳过不重建':r.notes||'匹配成功，等待确认'))}${r.kind==='conflict'?'<br><button class="link small" data-conflict-detail>查看已有记录</button>':''}</td></tr>`).join(''):'<tr><td colspan="8"><div class="empty">此类别没有记录</div></td></tr>'}</tbody></table></div><div class="bottom-actions"><button data-action="backUpload">← 上一步</button><div class="actions"><span class="small muted">${c.error?'修正全部问题后才能继续':'预校验不会新增或修改业务记录'}</span><button class="primary" data-action="toConfirm" ${c.error?'disabled':''}>${c.new?'下一步：确认导入 →':'查看结果：无需新增 →'}</button></div></div></section>`;
}
function scopeTable(result=false){return `<div class="table-wrap"><table><thead><tr><th>一级区域</th><th>二级区域</th><th>回收批次</th><th>文件行数</th><th>${result?'实际新增':'待新增'}</th><th>跳过</th></tr></thead><tbody>${scopes(rows()).map(s=>{let group=rows().filter(r=>r.level1===s.level1&&r.level2===s.level2&&r.batch===s.batch);return `<tr><td>${s.level1}</td><td>${s.level2}</td><td>${s.batch}</td><td>${s.count}</td><td>${group.filter(r=>r.kind==='new').length}</td><td>${group.filter(r=>r.kind==='duplicate').length}</td></tr>`}).join('')}</tbody></table></div>`}
function confirmView(){const c=counts();return `${metrics()}<section class="panel"><div class="panel-body"><h2 class="panel-title">核对本次导入范围</h2><p class="small muted">${escapeHTML(state.fileName)} · 文件同时涉及不同二级区域和回收批次，请逐项核对。</p></div>${scopeTable()}<div class="confirm-box"><div class="notice"><strong>本次只新增 ${c.new} 条记录，跳过 ${c.duplicate} 条重复</strong>已有记录不修改。提交时将再次校验权限和编号冲突，任一新增失败则整批回滚。</div><label class="confirm-check"><input id="confirmCheck" type="checkbox" ${state.checked?'checked':''} ${state.submitting?'disabled':''}><span>我已核对区域、回收批次和数量，确认提交本次新增记录。</span></label></div><div class="bottom-actions"><button data-action="backValidation" ${state.submitting?'disabled':''}>← 返回预校验</button><button class="primary" data-action="submit" ${!state.checked||state.submitting?'disabled':''}>${state.submitting?'<span class="loading"></span>正在提交…':'确认导入 '+c.new+' 条'}</button></div></section><p class="small muted">此处的“确认”是数据写入前的核对步骤，不增加负责人审核流程。</p>`}
function resultView(){const c=counts();if(state.result==='conflict')return `<section class="panel"><div class="result-hero"><div class="result-icon">!</div><h2>提交未完成：发现并发冲突</h2><p>演示情景：预校验后，701A 的同批次记录已被其他人建立。</p><div class="result-metrics"><div><strong>0</strong><span>本次新增</span></div><div><strong>${c.new}</strong><span>待重新核对</span></div></div></div><div class="panel-body"><div class="notice error"><strong>本批新增全部回滚，没有部分写入</strong>已有记录保持不变。请返回预校验，重新核对重复与冲突。</div></div><div class="bottom-actions"><button data-action="list">返回列表</button><button class="primary" data-action="retryConflict">重新预校验</button></div></section>`;
 if(state.result==='unknown')return `<section class="panel"><div class="result-hero"><div class="result-icon">?</div><h2>通信中断，导入结果待确认</h2><p>当前无法确认本次提交是否完成，请先查询处理结果。</p></div><div class="panel-body"><div class="notice"><strong>暂不显示新增数量，也不提示“肯定未写入”</strong>请勿直接重复点击提交。原型可模拟服务恢复后查询到已完成结果。</div></div><div class="bottom-actions"><button data-action="list">返回列表</button><button class="primary" data-action="resolveUnknown">查询本次结果（演示恢复）</button></div></section>`;
 const duplicate=state.result==='duplicates';return `<section class="panel"><div class="result-hero"><div class="result-icon">${duplicate?'＝':'✓'}</div><h2>${duplicate?'全部重复，无需新增':'导入完成'}</h2><p>${escapeHTML(state.fileName)} · ${duplicate?'原有记录保持不变':'新增记录已加入本次演示列表'}</p><div class="result-metrics"><div><strong>${duplicate?0:c.new}</strong><span>实际新增</span></div><div><strong>${c.duplicate}</strong><span>重复跳过</span></div><div><strong>0</strong><span>失败</span></div></div></div>${scopeTable(true)}<div class="panel-body"><div class="notice"><strong>${duplicate?'没有重复创建记录':'回收记录已保存，媒体文件尚未入库'}</strong>未出现在文件中的相机保持原状。已回收不表示影像可用；空卡、损坏等情况仍保留在备注。</div></div><div class="bottom-actions"><button data-action="resultReport">↓ 下载处理结果</button><div class="actions"><button data-action="importAgain">继续导入其他文件</button><button class="primary" data-action="viewImported">查看本次批次记录</button></div></div></section>`;
}
function loadSample(fixed){state.selected=true;state.fixed=fixed;state.fileName=fixed?'工作与回收周期_已修正示例.xlsx':'工作与回收周期_含错误示例.xlsx';if(state.scenario!=='errors')state.fixed=true;state.checked=false;state.result=null;state.resultRows=null;state.tab='all';state.recheckConflict=false;render()}
function startImport(){state.page='import';state.step=1;state.selected=false;state.fixed=state.scenario!=='errors';state.fileName='';state.checked=false;state.result=null;state.resultRows=null;state.tab='all';state.recheckConflict=false;state.concurrentInjected=false;render();window.scrollTo(0,0)}
function leave(callback){if(state.page==='import'&&state.selected&&state.step<4){showModal('离开本次导入？','<p>当前文件尚未完成提交。离开后，本次预校验内容不会保存，已有回收记录不受影响。</p>',[{label:'继续查看',action:closeModal},{label:'离开导入',primary:true,action:()=>{closeModal();callback()}}]);return}callback()}
function applySuccess(){const source=rows();state.resultRows=structuredClone(source);const existing=new Set(state.records.map(key));source.filter(r=>r.kind==='new').forEach(r=>{if(!existing.has(key(r))){state.records.unshift({...r});existing.add(key(r))}});state.result='success';state.step=4;state.submitting=false;render();window.scrollTo(0,0)}
function submit(){if(state.submitting||!state.checked||counts().error)return;state.submitting=true;render();setTimeout(()=>{state.submitting=false;if(state.scenario==='conflict'&&!state.concurrentInjected){state.concurrentInjected=true;const other={...rows()[0]};if(!state.records.some(r=>key(r)===key(other)))state.records.unshift(other);state.result='conflict';state.step=4;render()}else if(state.scenario==='unknown'){state.result='unknown';state.step=4;render()}else applySuccess()},700)}
function showModal(title,body,buttons){$('#overlay').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${escapeHTML(title)}"><header>${escapeHTML(title)}<button class="link" id="closeModal" aria-label="关闭弹窗">×</button></header><div class="body">${body}</div><footer>${buttons.map((b,i)=>`<button id="modalBtn${i}" class="${b.primary?'primary':''}">${b.label}</button>`).join('')}</footer></section></div>`;$('#closeModal').onclick=closeModal;buttons.forEach((b,i)=>$('#modalBtn'+i).onclick=b.action);$('#closeModal').focus();}
function closeModal(){$('#overlay').innerHTML=''}
function showDetail(record){showModal('周期详情 · '+record.device,`<p class="small muted">示例记录，返回后保留列表筛选；不展示精确坐标。</p><div class="detail-grid">${[['区域',record.level1+' / '+record.level2],['位点',record.site],['相机编号',record.device],['回收批次',record.batch],['工作开始日期',record.start||'未知'],['工作结束日期',record.end||'未知'],['数据取回日期',record.retrieved||'未填写'],['回收状态',record.status],['维护人员',record.person],['备注',record.notes||'—']].map(([label,value])=>`<div><span>${label}</span>${escapeHTML(value)}</div>`).join('')}</div>`,[{label:'返回',action:closeModal},{label:'更正记录（演示）',primary:true,action:()=>showForm(record)}])}
function showForm(record=null){state.form=record?{...record,_editing:true}:{...row('701','701A'),_editing:false};state.formError='';renderForm()}
function renderForm(){const r=state.form;const editing=!!r._editing;showModal(editing?'更正周期资料（示例）':'手工补录（示例）',`<p class="small muted">少量补录和已有记录纠错使用此入口。仅改变内存中的演示数据。</p><form id="recordForm"><div class="form-grid"><label class="field">一级区域<input value="山西" disabled></label><label class="field">二级区域<input value="${r.level2}" disabled></label><label class="field">位点编号<input name="site" value="${r.site}" maxlength="20" ${editing?'disabled':''} required></label><label class="field">相机编号<input name="device" value="${r.device}" maxlength="20" ${editing?'disabled':''} required></label><label class="field">回收批次<input name="batch" value="${r.batch}" maxlength="20" ${editing?'disabled':''} required></label><label class="field">回收状态<select name="status"><option ${r.status==='已回收'?'selected':''}>已回收</option><option ${r.status==='未回收'?'selected':''}>未回收</option></select></label><label class="field">工作开始日期<input type="date" name="start" value="${r.start}"></label><label class="field">工作结束日期<input type="date" name="end" value="${r.end}"></label><label class="field">数据取回日期<input type="date" name="retrieved" value="${r.retrieved}"></label><label class="field">维护人员<input name="person" value="${escapeHTML(r.person)}"></label><label class="field full">备注<input name="notes" value="${escapeHTML(r.notes)}"></label></div>${state.formError?'<div class="form-error" role="alert">'+escapeHTML(state.formError)+'</div>':''}<button type="submit" hidden></button></form>`,[{label:'取消',action:closeModal},{label:'保存到演示列表',primary:true,action:saveForm}]);$('#recordForm').onsubmit=e=>{e.preventDefault();saveForm()}}
function saveForm(){const form=$('#recordForm');if(!form.reportValidity())return;let updates=Object.fromEntries(new FormData(form));let r={...state.form,...updates};if(r.start&&r.end&&r.end<r.start){state.form=r;state.formError='工作结束日期不能早于开始日期。';renderForm();return}if(!/^\d{4}(0[1-9]|1[0-2])$/.test(r.batch)){state.form=r;state.formError='请填写有效的 YYYYMM 回收批次。';renderForm();return}const oldIndex=state.records.findIndex(x=>key(x)===key(r));if(oldIndex>=0&&!r._editing){state.form=r;state.formError='同位点、相机、批次已存在，请查看原记录。';renderForm();return}if(oldIndex>=0)state.records[oldIndex]=r;else state.records.unshift(r);closeModal();render();toast('演示记录已保存；未写入正式业务数据库')}
function bind(){
 document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>action(el.dataset.action));
 document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{state.tab=el.dataset.tab;render()});
 document.querySelectorAll('[data-detail]').forEach(el=>el.onclick=()=>showDetail(state.records.find(r=>key(r)===el.dataset.detail)));
 document.querySelectorAll('[data-conflict-detail]').forEach(el=>el.onclick=()=>showDetail(baseline.find(r=>r.device==='704A')));
 $('#scenario').onchange=e=>{const value=e.target.value;leave(()=>{state.scenario=value;startImport();loadSample(value!=='errors');if(value==='duplicates')state.records=structuredClone(rows())})};
 if($('#filters'))$('#filters').onsubmit=e=>{e.preventDefault();state.filters=Object.fromEntries(new FormData(e.target));state.pageNo=1;render()};
 if($('#fileInput'))$('#fileInput').onchange=e=>{let f=e.target.files[0];if(!f)return;if(!f.name.toLowerCase().endsWith('.xlsx')){toast('演示仅接受 .xlsx 文件选择');return}state.selected=true;state.fileName=f.name;state.fixed=state.scenario!=='errors';render();toast('仅演示文件选择；下步显示内置示例校验结果')};
 if($('#confirmCheck'))$('#confirmCheck').onchange=e=>{state.checked=e.target.checked;const button=document.querySelector('[data-action="submit"]');button.disabled=!state.checked};
}
function action(name){switch(name){case 'import':startImport();break;case 'list':if(!state.submitting)leave(()=>{state.page='list';render()});break;case 'reset':leave(()=>{state={...state,page:'list',step:1,selected:false,scenario:'errors',fixed:false,checked:false,result:null,records:structuredClone(baseline),recheckConflict:false,concurrentInjected:false,filters:{level1:'',level2:'',batch:'',keyword:'',status:''},pageNo:1};render();toast('已重置为初始示例数据')});break;case 'manual':showForm();break;case 'clearFilters':state.filters={level1:'',level2:'',batch:'',keyword:'',status:''};state.pageNo=1;render();break;case 'prevPage':state.pageNo--;render();break;case 'nextPage':state.pageNo++;render();break;case 'chooseFile':$('#fileInput').click();break;case 'sampleError':state.scenario='errors';loadSample(false);break;case 'sampleFixed':loadSample(true);break;case 'removeFile':state.selected=false;state.fileName='';render();break;case 'template':downloadXlsx('template');break;case 'validate':if(state.selected){state.step=2;state.tab='all';render();window.scrollTo(0,0)}break;case 'backUpload':case 'reupload':state.step=1;state.checked=false;render();break;case 'errorReport':downloadReport();break;case 'fixedHere':loadSample(true);state.step=2;render();toast('已载入修正示例；重新预校验通过');break;case 'toConfirm':if(counts().error)return;if(counts().new===0){state.resultRows=structuredClone(rows());state.step=4;state.result='duplicates'}else{state.step=3;state.checked=false}render();window.scrollTo(0,0);break;case 'backValidation':state.step=2;state.checked=false;render();break;case 'submit':submit();break;case 'resultReport':downloadReport(true);break;case 'viewImported':state.filters={level1:'山西',level2:'',batch:'',keyword:'',status:''};state.page='list';state.pageNo=1;render();toast('展示本次涉及的山西全部二级区域及批次');break;case 'importAgain':startImport();break;case 'retryConflict':state.step=2;state.checked=false;state.fixed=true;state.result=null;state.recheckConflict=true;render();break;case 'resolveUnknown':applySuccess();break;}}
window.addEventListener('beforeunload',e=>{if(state.page==='import'&&state.selected&&state.step<4){e.preventDefault();e.returnValue=''}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#overlay').children.length)closeModal()});
render();
</script>
