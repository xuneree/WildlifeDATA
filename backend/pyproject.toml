[project]
name = "wildlife-data"
version = "0.1.0"
description = "红外相机数据管理平台"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2", "itsdangerous>=2.2,<3",
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
