name: Test and build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: wildlife_test
          POSTGRES_PASSWORD: ci-test-only-password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wildlife_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://wildlife_test:ci-test-only-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python scripts/tests/test_task_preflight.py
      - run: pip install uv==0.12.23
      - run: uv sync --project backend --frozen
      - run: backend/.venv/bin/ruff check backend
      - run: python scripts/test-backend.py
      - run: npm ci --prefix frontend --no-audit --no-fund
      - run: npm run build --prefix frontend

  module02-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/demos/module02/package-lock.json
      - run: npm ci --prefix docs/demos/module02 --no-audit --no-fund
      - run: npm test --prefix docs/demos/module02
      - run: npm run build --prefix docs/demos/module02
